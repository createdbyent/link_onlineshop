<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Belanja Rekomendasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#FFFDF7;
    --ink:#1A1A1A;
    --muted:#8A8A8A;
    --shopee:#EE4D2D;
    --shopee-tint:#FFF0EA;
    --backdrop:#2B2A28;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--backdrop);
    font-family:'Space Mono', monospace;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:48px 16px;
  }
  .receipt{
    width:100%;
    max-width:400px;
    background:var(--paper);
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
    padding:32px 28px 8px;
    animation:print 0.6s ease-out;
  }
  @keyframes print{
    from{transform:translateY(-16px);opacity:0;}
    to{transform:translateY(0);opacity:1;}
  }
  .toko{
    font-family:'Archivo Black', sans-serif;
    text-align:center;
    font-size:22px;
    margin:0 0 4px;
  }
  .handle{ text-align:center; color:var(--muted); font-size:12px; margin:0 0 6px; }
  .bio{ text-align:center; font-size:12px; line-height:1.6; margin:0 0 18px; }
  .divider{ border:none; border-top:1px dashed #C9C4B4; margin:16px 0; }
  .meta-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .items{ list-style:none; margin:8px 0 0; padding:0; }
  .item{
    display:block; text-decoration:none; color:var(--ink);
    padding:14px 0; border-bottom:1px dashed #C9C4B4;
    transition:background 0.15s ease;
  }
  .item:hover{ background:var(--shopee-tint); }
  .item-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:13px; font-weight:700; }
  .item-name{ flex:1; }
  .item-price{ color:var(--shopee); white-space:nowrap; }
  .item-bottom{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .item-tag{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
  .cta{ font-size:10px; font-weight:700; color:#fff; background:var(--shopee); padding:4px 10px; border-radius:3px; }
  .note{ text-align:center; font-size:10.5px; color:var(--muted); line-height:1.7; margin:18px 0 16px; }
  .qr-section{ display:flex; justify-content:center; gap:18px; margin:0 0 10px; }
  .qr-item{ text-align:center; text-decoration:none; color:var(--ink); }
  .qr-item .qr-box{ width:76px; height:76px; margin:0 auto 6px; border:1px solid #E5E0D2; background:#fff; }
  .qr-item span{ font-size:9px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; }
  .thanks{ text-align:center; font-size:11px; letter-spacing:1px; color:var(--muted); margin-bottom:24px; }
  .zigzag{
    height:14px;
    background:
      linear-gradient(-45deg, var(--backdrop) 8px, transparent 0),
      linear-gradient(45deg, var(--backdrop) 8px, transparent 0);
    background-size:16px 16px;
    background-position:left bottom;
    background-repeat:repeat-x;
  }
</style>
</head>
<body>

<div class="receipt">
  <p class="toko" id="judul-video">Nama Video / Tema</p>
  <p class="handle">@findbypicks</p>
  <p class="bio">Semua produk di video ini, ada di sini.<br>Tap item &rarr; lanjut checkout di Shopee.</p>

  <hr class="divider">
  <div class="meta-row"><span>NO. STRUK</span><span id="no-struk">001</span></div>
  <div class="meta-row"><span>TANGGAL</span><span id="tanggal"></span></div>
  <hr class="divider">

  <ul class="items" id="daftar-produk"></ul>

  <p class="note">Klik salah satu produk di atas untuk membuka Shopee.<br>Link ini adalah link affiliate — belanja kamu bantu dukung konten ini.</p>

  <div class="qr-section" id="qr-section"></div>
  <p class="thanks">TERIMA KASIH SUDAH MAMPIR</p>
</div>
<div class="zigzag"></div>

<script>
  var JUDUL_VIDEO = "LINK OOTD INSPO";
  var NOMOR_STRUK = "010";

  var SOSMED = [
    { label: "X",       link: "https://x.com/findmypicks" },
    { label: "Pinterest", link: "https://pin.it/6csDGzVfj" },
    { label: "TikTok",  link: "https://www.tiktok.com/@findmypicks" }
  ];

  var PRODUK = [
    { nama: "Kaos Crop Top", harga: "Rp 85.000", tag: "Baju", link: "https://s.shopee.co.id/904ev2FRjn" },
    { nama: "Celana Pendek Jeans", harga: "Rp 93.000", tag: "Celana", link: "https://s.shopee.co.id/6q0AL2g6sf" },
    { nama: "Tas", harga: "Rp 144.888", tag: "Tas", link: "https://s.shopee.co.id/4AzPA39s7a" },
    { nama: "Vans Super Lowpro", harga: "844.350", tag: "Sepatu", link: "https://s.shopee.co.id/6fgk8msJrP" }
  ];

  document.getElementById('judul-video').textContent = JUDUL_VIDEO;
  document.getElementById('no-struk').textContent = NOMOR_STRUK;
  document.getElementById('tanggal').textContent = new Date().toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' });

  var listEl = document.getElementById('daftar-produk');
  PRODUK.forEach(function(p){
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'item';
    a.href = p.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML =
      '<div class="item-top">' +
        '<span class="item-name">' + p.nama + '</span>' +
        '<span class="item-price">' + p.harga + '</span>' +
      '</div>' +
      '<div class="item-bottom">' +
        '<span class="item-tag">' + p.tag + '</span>' +
        '<span class="cta">Belanja</span>' +
      '</div>';
    li.appendChild(a);
    listEl.appendChild(li);
  });

  var qrEl = document.getElementById('qr-section');
  SOSMED.forEach(function(s){
    var a = document.createElement('a');
    a.className = 'qr-item';
    a.href = s.link;
    a.target = '_blank';
    a.rel = 'noopener';
    var box = document.createElement('div');
    box.className = 'qr-box';
    var span = document.createElement('span');
    span.textContent = s.label;
    a.appendChild(box);
    a.appendChild(span);
    qrEl.appendChild(a);
    new QRCode(box, {
      text: s.link,
      width: 76,
      height: 76,
      colorDark: '#1A1A1A',
      colorLight: '#ffffff'
    });
  });
</script>
</body>
</html>
